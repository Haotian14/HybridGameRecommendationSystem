[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hgrs"
version = "1.0.0"
description = "Hybrid game recommendation system for Steam: TF-IDF + Sentence-BERT + KNN + SVD, combined as a cascade pipeline or a weighted fusion."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24,<2.3",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "scikit-surprise>=1.1.3",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
bert = ["sentence-transformers>=2.2"]
dev = ["pytest>=7"]

[project.scripts]
hgrs = "hgrs.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
